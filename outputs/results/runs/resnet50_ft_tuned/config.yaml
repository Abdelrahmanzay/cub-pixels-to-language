seed: 42
task: classification
run_name: resnet50_ft_tuned
output_dir: outputs/runs
data:
  root: data/processed
  image_size: 224
  batch_size: 32
  num_workers: 4
  normalization: imagenet
  augmentation: standard
model:
  encoder: resnet50
  pretrained: true
  freeze_encoder: false
  dropout: 0.2
  encoder_kwargs: {}
train:
  epochs: 30
  optimizer: adamw
  lr: 0.0020943
  backbone_lr_mult: 0.1
  weight_decay: 3.36e-05
  momentum: 0.9
  scheduler: cosine
  warmup_epochs: 1
  label_smoothing: 0.1
  amp: true
  grad_clip: null
  early_stopping_patience: 8
  max_steps_per_epoch: null
  evaluate_test: true
  allow_cpu: false
tracking:
  backends:
  - local
  - wandb
  project: cub-pixels-to-language
  entity: 23p0094-ain-shams-university
  mode: online
  group: null
  tags:
  - transfer
  - fine-tune
  - tuned
