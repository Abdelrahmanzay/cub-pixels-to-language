seed: 42
task: classification
run_name: convnext_bbox
output_dir: outputs/runs
data:
  root: data/processed_hr
  image_size: 224
  batch_size: 32
  num_workers: 3
  normalization: imagenet
  augmentation: standard
  crop: bbox
  bbox_margin: 0.15
  train_on_val: false
model:
  encoder: convnext_tiny
  pretrained: true
  freeze_encoder: false
  dropout: 0.2
  encoder_kwargs: {}
  cosine_scale: 16.0
train:
  epochs: 30
  optimizer: adamw
  lr: 0.001
  backbone_lr_mult: 0.1
  weight_decay: 0.0001
  momentum: 0.9
  scheduler: cosine
  warmup_epochs: 1
  label_smoothing: 0.1
  amp: true
  grad_clip: null
  early_stopping_patience: 8
  max_steps_per_epoch: null
  evaluate_test: true
  allow_cpu: false
  loss: ce
  cosine_xent_weight: 0.1
  mixup_alpha: 0.0
  cutmix_alpha: 0.0
  mix_prob: 1.0
  select: best_val
  tta: true
tracking:
  backends:
  - local
  - wandb
  project: cub-pixels-to-language
  entity: 23p0094-ain-shams-university
  mode: online
  group: null
  tags:
  - improve
  - bbox
