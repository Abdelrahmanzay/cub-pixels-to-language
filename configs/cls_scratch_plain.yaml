# Ablation: same CNN WITHOUT residual connections (does the skip connection matter?)
run_name: scratch_cnn_plain
model:
  encoder: scratch_cnn_plain
  pretrained: false
  dropout: 0.3
data:
  normalization: cub
  augmentation: standard
  batch_size: 64
train:
  epochs: 40
  lr: 0.002
  weight_decay: 0.05
  warmup_epochs: 3
  early_stopping_patience: 15
tracking:
  tags: [scratch, ablation]
