# Tuning v2 (fixes the v1 limitation): longer 15-epoch proxy, on the final model family
# (ConvNeXt-T, bird crops), 4 hyper-parameters, random search.
base_config: configs/improve/convnext_bbox.yaml
trials: 8
seed: 1
overrides:
  - train.epochs=15
  - train.early_stopping_patience=100
  - train.evaluate_test=false
  - train.tta=false
space:
  train.lr:               {type: loguniform, low: 0.0003, high: 0.004, grid: [0.0005, 0.001, 0.002]}
  train.weight_decay:     {type: loguniform, low: 0.00001, high: 0.05, grid: [0.0001, 0.001, 0.01]}
  train.backbone_lr_mult: {type: loguniform, low: 0.03, high: 0.5, grid: [0.05, 0.1, 0.3]}
  train.label_smoothing:  {type: uniform, low: 0.0, high: 0.2, grid: [0.0, 0.1, 0.2]}
